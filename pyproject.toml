[project]
name = "pb"
version = "0.1.0"
description = "provenance-budget — measuring attack success vs. benign task completion as a function of provenance-labeller accuracy for tool-using LLM agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pb"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "pb.enforce.*"
strict = true
